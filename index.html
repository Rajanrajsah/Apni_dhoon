<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Key-Vibe Mobile | Hindi Piano</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="start-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; display:flex; flex-direction:column; justify-content:center; align-items:center;">
    <h1 style="color:#00f2fe;">KEY-VIBE PRO</h1>
    <button id="start-btn" style="padding:20px 40px; font-size:20px; cursor:pointer; background:#00f2fe; border:none; border-radius:10px; font-weight:bold;">START PLAYING</button>
    <p style="margin-top:20px;">Tap to enable sound on your device</p>
    </div>
    
    <header>
        <h1>KEY-VIBE <span>// PRO</span></h1>
        <p>Tap keys or use your computer keyboard.</p>
    </header>

    <div class="piano-wrapper">
        <div class="piano">
            <div data-key="A" class="key white"><span>A</span></div>
            <div data-key="W" class="key black"><span>W</span></div>
            <div data-key="S" class="key white"><span>S</span></div>
            <div data-key="E" class="key black"><span>E</span></div>
            <div data-key="D" class="key white"><span>D</span></div>
            <div data-key="F" class="key white"><span>F</span></div>
            <div data-key="T" class="key black"><span>T</span></div>
            <div data-key="G" class="key white"><span>G</span></div>
            <div data-key="Y" class="key black"><span>Y</span></div>
            <div data-key="H" class="key white"><span>H</span></div>
            <div data-key="U" class="key black"><span>U</span></div>
            <div data-key="J" class="key white"><span>J</span></div>
        </div>
    </div>

    <section class="song-guide">
        <div class="song-card">
            <h3>Kesariya</h3>
            <code>A-S-D-F-G-F-D-S</code>
        </div>
        <div class="song-card">
            <h3>Tum Hi Ho</h3>
            <code>D-E-F-E-D-S-A</code>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
